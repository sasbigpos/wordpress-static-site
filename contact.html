<body>

        <nav>
            <div class="logo">MySite</div>

                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-form">
            <h2>Get your personalized consultation</h2>
            <p>Tell us about your business and our team will get you set up.</p>

            <form id="contactForm">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" placeholder="Name" required>

                <label for="phone">Contact Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="+60" required>

                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="Email" required>

                <label for="state">State *</label>
                <select id="state" name="state" required>
                    <option value="">Select Value</option>
                    <option value="Johor">Johor</option>
                    <option value="Kedah">Kedah</option>
                    <option value="Kelantan">Kelantan</option>
                    <option value="Kuala Lumpur">Kuala Lumpur</option>
                    <option value="Labuan">Labuan</option>
                    <option value="Melaka">Melaka</option>
                    <option value="Negeri Sembilan">Negeri Sembilan</option>
                    <option value="Pahang">Pahang</option>
                    <option value="Penang">Penang</option>
                    <option value="Perak">Perak</option>
                    <option value="Perlis">Perlis</option>
                    <option value="Putrajaya">Putrajaya</option>
                    <option value="Sabah">Sabah</option>
                    <option value="Sarawak">Sarawak</option>
                    <option value="Selangor">Selangor</option>
                    <option value="Terengganu">Terengganu</option>
                </select>

                <label for="business_type">Business Type *</label>
                <select id="business_type" name="business_type" required>
                    <option value="">Select Value</option>
                    <option value="Food & Beverage">Food & Beverage</option>
                    <option value="Retail">Retail</option>
                    <option value="Services">Services</option>
                    <option value="E-commerce">E-commerce</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

                <label for="message">Tell Us More About Your Business *</label>
                <textarea id="message" name="message" placeholder="Tell Us More About Your Business" required></textarea>

                <button type="submit" id="submitBtn">Submit</button>
            </form>

            <p id="formStatus"></p>
        </div>
    </main>
